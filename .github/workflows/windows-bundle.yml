name: Windows bundle

# Builds the offline Windows bundle and tests it on a clean Windows machine:
# the self-test, a PI check against no server (it must fail cleanly), and the UI. Then builds the
# installer from it and tests the shared server as a Windows service with Windows sign-in.
on:
  push:
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/windows-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write   # to publish the tested zip as a pre-release

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Build
        run: |
          python -m pip install uv build
          python packaging/build_windows_bundle.py

      - name: Unpack where a site would
        shell: pwsh
        run: |
          Expand-Archive dist\*.zip -DestinationPath C:\PICT
          Get-ChildItem C:\PICT

      - name: Self-test
        shell: cmd
        env:
          PICT_QUIET: "1"
          PICT_WORK: C:\pict-work
        run: |
          for /d %%d in (C:\PICT\PI-Compression-Tuner-*) do call "%%d\Run self-test.cmd"

      - name: PI check with no server fails cleanly
        shell: pwsh
        run: |
          $pict = (Get-ChildItem C:\PICT\PI-Compression-Tuner-*\pict.cmd).FullName
          $out = & $pict pi check --server NOSUCHSERVER --url https://127.0.0.1:9/piwebapi 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -ne 1) { throw "expected exit code 1, got $LASTEXITCODE" }
          if ($out -notmatch "PI Web API: failed \(ConnectionError" -or $out -notmatch "AF SDK: failed") { throw "missing per-source report" }
          exit 0   # pict pi check is meant to exit 1 here

      - name: UI starts and answers
        shell: pwsh
        run: |
          $pict = (Get-ChildItem C:\PICT\PI-Compression-Tuner-*\pict.cmd).FullName
          $p = Start-Process -FilePath $pict -ArgumentList "ui","--port","8599" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8599/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match "streamlit" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          if (-not $ok) { throw "the UI did not answer on port 8599" }

      - name: Self-test spots an incomplete install
        shell: pwsh
        run: |
          $dir = (Get-ChildItem C:\PICT\PI-Compression-Tuner-*).FullName
          Remove-Item "$dir\python\Lib\site-packages\pi_compression_tuner\settings.py"
          & "$dir\python\python.exe" -s "$dir\check_components.py" --install-only
          if ($LASTEXITCODE -ne 1) { throw "a missing file went unnoticed" }
          exit 0

      - name: Build the installer
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip).FullName
          Expand-Archive $zip -DestinationPath C:\installer-src
          $src = (Get-ChildItem C:\installer-src\PI-Compression-Tuner-*).FullName
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          & $iscc /Q "/DAppVersion=$version" "/DSourceDir=$src" "/DOutputDir=$pwd\dist" packaging\installer\pict.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          $setup = (Get-ChildItem dist\*-Setup.exe).FullName
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $setup -Leaf) | Set-Content "$setup.sha256"
          Get-ChildItem dist

      - name: Installer sets up the shared server as a service
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\*-Setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=service,firewall','/PORT=8601','/LOG=C:\setup.log' -Wait -PassThru
          Get-Content "$env:ProgramData\PI Compression Tuner\service-install.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content C:\setup.log -Tail 40; throw "setup exited with $($p.ExitCode)" }
          $svc = Get-Service PICompressionTuner
          $svc | Format-List Name, Status, StartType
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8601/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-ChildItem "$env:ProgramData\PI Compression Tuner\logs" | ForEach-Object { Get-Content $_.FullName -Tail 40 }; throw "the service did not answer" }

          # No sign-in: a Negotiate challenge. Windows sign-in as this (admin) account: the UI.
          $r = Invoke-WebRequest http://localhost:8601/ -SkipHttpErrorCheck -UseBasicParsing
          if ($r.StatusCode -ne 401 -or "$($r.Headers['WWW-Authenticate'])" -notmatch "Negotiate") { throw "expected a 401 Negotiate challenge, got $($r.StatusCode)" }
          $r = Invoke-WebRequest http://localhost:8601/ -UseDefaultCredentials -AllowUnencryptedAuthentication -UseBasicParsing -SessionVariable web
          if ($r.StatusCode -ne 200) { throw "Windows sign-in failed: $($r.StatusCode)" }
          if (-not ($web.Cookies.GetCookies("http://localhost:8601/") | Where-Object Name -eq "pict_signin")) { throw "no sign-in cookie" }
          $log = Get-Content "$env:ProgramData\PI Compression Tuner\pict-activity.log" -Raw
          $log
          if ($log -notmatch "signed in\tadmin through BUILTIN\\Administrators") { throw "the sign-in was not logged as an admin" }
          if (-not (Get-NetFirewallRule -DisplayName "PI Compression Tuner" -ErrorAction SilentlyContinue)) { throw "no firewall rule" }

      - name: Uninstall removes the service
        shell: pwsh
        run: |
          $p = Start-Process "$env:ProgramFiles\PI Compression Tuner\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait -PassThru
          Start-Sleep -Seconds 5
          if (Get-Service PICompressionTuner -ErrorAction SilentlyContinue) { throw "the service is still installed" }
          if (Get-NetFirewallRule -DisplayName "PI Compression Tuner" -ErrorAction SilentlyContinue) { throw "the firewall rule is still there" }

      - uses: actions/upload-artifact@v4
        with:
          name: PI-Compression-Tuner-win64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          compression-level: 0
          retention-days: 30

      # Each tested push replaces the pre-release for this version, so the
      # Releases page always offers the latest tested zip for download.
      - name: Publish as a pre-release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist\*.zip).FullName
          $setup = (Get-ChildItem dist\*-Setup.exe).FullName
          $tag = "bundle-" + [IO.Path]::GetFileNameWithoutExtension($zip).Replace("PI-Compression-Tuner-", "")
          gh release delete $tag --cleanup-tag --yes 2>$null
          $notes = "Offline Windows bundle for site testing, built and tested from ${{ github.ref_name }} at ${{ github.sha }}. Unzip it and follow START-HERE.txt inside, or run the Setup.exe installer, which can also set up the shared server as a Windows service."
          gh release create $tag $zip "$zip.sha256" $setup "$setup.sha256" --target ${{ github.sha }} --prerelease --title "Site test bundle $tag" --notes $notes
